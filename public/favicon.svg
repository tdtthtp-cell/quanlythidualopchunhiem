<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Star Ring / Laurel Accent -->
  <circle cx="32" cy="32" r="26" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Trophy Graphic -->
  <g filter="url(#shadow)">
    <!-- Trophy Base -->
    <path d="M22 51h20v3H22z" fill="#b45309" />
    <path d="M24 47h16v4H24z" fill="url(#goldGrad)" rx="1" />
    <path d="M29 41h6v6h-6z" fill="#d97706" />

    <!-- Trophy Handles -->
    <path d="M19 22c-5 0-7 5-7 10s4 8 8 8h1v-4h-1c-2.5 0-4-2-4-5s1.5-5 4-5h1v-4z" fill="url(#goldGrad)" />
    <path d="M45 22c5 0 7 5 7 10s-4 8-8 8h-1v-4h1c2.5 0 4-2 4-5s-1.5-5-4-5h-1v-4z" fill="url(#goldGrad)" />

    <!-- Trophy Cup Body -->
    <path d="M19 20h26v11c0 8-5.5 13-13 13s-13-5-13-13V20z" fill="url(#cupGrad)" />
    
    <!-- Cup Rim -->
    <rect x="18" y="18" width="28" height="4" rx="2" fill="#fef08a" />

    <!-- Star Emblem on Cup -->
    <polygon points="32,23 33.8,28.5 39.5,28.5 35,32 36.7,37.5 32,34.2 27.3,37.5 29,32 24.5,28.5 30.2,28.5" fill="#ffffff" />
  </g>

  <!-- Graduation Cap / Emulation Badge Accent -->
  <g transform="translate(38, 8) scale(0.65)">
    <polygon points="16,4 30,11 16,18 2,11" fill="#38bdf8" />
    <path d="M6 14v8c0 3 4.5 5 10 5s10-2 10-5v-8" stroke="#0284c7" stroke-width="2" fill="none" />
    <path d="M27 12v12" stroke="#facc15" stroke-width="2" stroke-linecap="round" />
    <circle cx="27" cy="25" r="2" fill="#facc15" />
  </g>
</svg>
